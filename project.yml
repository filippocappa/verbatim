name: Verbatim
options:
  bundleIdPrefix: com.fcappa
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    # Rename the app here. Everything the user sees reads this.
    APP_DISPLAY_NAME: Verbatim
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_INFER_ISOLATED_CONFORMANCES: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Verbatim:
    type: application
    platform: macOS
    sources:
      - path: Verbatim
    settings:
      base:
        PRODUCT_NAME: Verbatim
        PRODUCT_BUNDLE_IDENTIFIER: com.fcappa.Verbatim
        INFOPLIST_FILE: Verbatim/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Verbatim/Resources/Verbatim.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 6HCM796G2T
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
